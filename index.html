<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그림 라이어 게임</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        
        #header-bar { width: 100%; max-width: 600px; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; text-align: center; }
        .player-badge { display: inline-block; background: #007bff; color: white; padding: 6px 14px; border-radius: 15px; margin: 3px; font-weight: bold; font-size: 15px; }

        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        h1, h2 { margin-top: 0; color: #333; }
        button { width: 100%; padding: 12px; margin: 6px 0; border: none; border-radius: 6px; background-color: #007bff; color: white; font-size: 16px; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #0056b3; }
        button.secondary { background-color: #6c757d; }
        button.secondary:hover { background-color: #545b62; }
        
        input, select { width: 100%; padding: 10px; margin: 6px 0 14px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        label { font-weight: bold; display: block; text-align: left; font-size: 14px; color: #555; }
        
        .screen { display: none; }
        .active { display: block; }
        .info-box { background: #e9ecef; padding: 10px; border-radius: 6px; word-break: break-all; margin: 10px 0; font-size: 14px; }
        .status-text { color: #28a745; font-size: 13px; font-weight: bold; margin-bottom: 10px; }
        
        .settings-box { background: #f8f9fa; border: 1px solid #e0e0e0; padding: 15px; border-radius: 8px; text-align: left; margin-bottom: 15px; }
        .error-message { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 12px; border-radius: 6px; margin: 10px 0; font-weight: bold; display: none; }

        #roulette-box { font-size: 28px; font-weight: bold; color: #dc3545; padding: 20px; border: 3px dashed #007bff; border-radius: 10px; margin: 15px 0; background: #f8f9fa; }
        .result-keyword { font-size: 20px; color: #28a745; margin-top: 10px; font-weight: bold; }

        .count-control { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .count-btn { width: 40px; height: 40px; margin: 0; font-weight: bold; font-size: 18px; }
        .count-display { font-size: 18px; font-weight: bold; min-width: 40px; text-align: center; }

        #turn-announcement { font-size: 22px; font-weight: bold; color: #ff5722; margin: 10px 0; min-height: 33px; }
        #canvas-container { position: relative; margin: 10px 0; }
        canvas { border: 2px solid #333; border-radius: 8px; background: white; cursor: crosshair; touch-action: none; }
        .canvas-controls { display: flex; gap: 8px; align-items: center; justify-content: center; margin-bottom: 10px; }
        .canvas-controls input[type="color"] { width: 40px; height: 40px; padding: 0; border: none; cursor: pointer; }
        .canvas-controls input[type="range"] { width: 100px; margin: 0; }
        .draw-actions { display: flex; gap: 10px; }
    </style>
</head>
<body>

    <div id="header-bar" style="display: none;">
        <strong>방 코드: <span id="display-room-code"></span></strong>
        <div id="connection-status" class="status-text">연결 중...</div>
        <div>참여 중인 사람 (<span id="player-count">0</span>명):</div>
        <div id="player-list"></div>
    </div>

    <div class="card">
        <div id="screen-main" class="screen active">
            <h1>그림 라이어 게임</h1>
            <button onclick="showScreen('screen-create')">게임 만들기</button>
            <button onclick="showScreen('screen-join')" class="secondary">게임 참여하기</button>
        </div>

        <div id="screen-create" class="screen">
            <h2>방 만들기</h2>
            <label>닉네임</label>
            <input type="text" id="create-name" placeholder="닉네임을 입력하세요">
            <button onclick="createRoom()">방 생성하기</button>
            <button onclick="showScreen('screen-main')" class="secondary">뒤로가기</button>
        </div>

        <div id="screen-join" class="screen">
            <h2>방 참여하기</h2>
            <input type="text" id="join-code" placeholder="방 코드 입력">
            <input type="text" id="join-name" placeholder="닉네임을 입력하세요">
            <button onclick="joinRoomByCode()">입장하기</button>
            <button onclick="showScreen('screen-main')" class="secondary">뒤로가기</button>
        </div>

        <div id="screen-link-join" class="screen">
            <h2>게임 참여하기</h2>
            <p>방에 입장하기 위한 닉네임을 입력하세요.</p>
            <input type="text" id="link-join-name" placeholder="닉네임을 입력하세요">
            <button onclick="joinRoomByLink()">입장하기</button>
        </div>

        <div id="screen-lobby" class="screen">
            <h2>대기실</h2>

            <div class="settings-box">
                <h3 style="margin-top: 0; font-size: 16px;">⚙️ 게임 설정</h3>
                
                <label>주제 선택</label>
                <select id="setting-category" onchange="updateSettings()">
                    <option value="동물">동물</option>
                    <option value="음식">음식</option>
                    <option value="인물">인물</option>
                    <option value="게임">게임</option>
                    <option value="애니">애니메이션</option>
                </select>

                <label>게임 모드</label>
                <select id="setting-mode" onchange="updateSettings()">
                    <option value="일반 모드">일반 모드</option>
                    <option value="바보 모드">바보 모드</option>
                    <option value="스파이 모드">스파이 모드</option>
                </select>

                <label>라이어 수</label>
                <div class="count-control">
                    <button class="count-btn secondary" onclick="changeLiarCount(-1)">-</button>
                    <span id="liar-count-display" class="count-display">1</span>
                    <button class="count-btn secondary" onclick="changeLiarCount(1)">+</button>
                </div>
            </div>

            <div>
                <strong>방 코드:</strong>
                <div id="lobby-code" class="info-box"></div>
            </div>
            <div>
                <strong>초대 링크:</strong>
                <div id="lobby-link" class="info-box"></div>
            </div>

            <div id="start-warning" class="error-message">⚠️ 플레이어가 3명 이상이어야 게임을 시작할 수 있습니다!</div>

            <button onclick="copyLink()">초대 링크 복사</button>
            <button id="btn-start" onclick="startGame()" style="display: none; background-color: #28a745; margin-top: 10px;">게임 시작하기</button>
        </div>

        <div id="screen-game" class="screen">
            <h2>역할 추첨</h2>
            <div id="roulette-box">추첨 준비 중...</div>
            <div id="role-result-box" style="display: none;">
                <p>당신의 역할:</p>
                <div id="my-role" style="font-size: 26px; font-weight: bold; color: #007bff;"></div>
                <div id="my-keyword" class="result-keyword"></div>
            </div>
        </div>

        <div id="screen-drawing" class="screen">
            <h2 id="turn-indicator">게임 진행 중</h2>
            <div id="turn-announcement"></div>

            <div class="canvas-controls">
                <label style="display:inline; width:auto; margin:0;">색상: </label>
                <input type="color" id="brush-color" value="#000000">
                <label style="display:inline; width:auto; margin:0; margin-left:10px;">굵기: </label>
                <input type="range" id="brush-size" min="1" max="20" value="3">
            </div>

            <div id="canvas-container">
                <canvas id="game-canvas" width="400" height="400"></canvas>
            </div>

            <div class="draw-actions" id="my-turn-controls" style="display: none;">
                <button class="secondary" onclick="resetMyStroke()">다시 그리기</button>
                <button style="background-color: #28a745;" onclick="finishMyTurn()">그만 (다음 턴)</button>
            </div>
        </div>
    </div>

    <script>
        var peer = null;
        var connections = [];
        var hostConn = null;
        var myName = "";
        var roomCode = "";
        var playersMap = {};
        var playerOrder = [];
        var isHost = false;

        var gameSettings = { category: "동물", mode: "일반 모드", liarCount: 1 };

        var currentTurnIndex = 0;
        var hasDrawnThisTurn = false;
        var isDrawing = false;
        var currentStroke = [];
        var turnsHistory = [];

        var canvas, ctx;

        var wordDatabase = {
            "동물": ["사자", "호랑이", "코끼리", "기린", "펭귄", "강아지", "고양이", "토끼", "판다", "독수리"],
            "음식": ["떡볶이", "비빔밥", "삼겹살", "치킨", "피자", "짜장면", "초밥", "햄버거", "파스타", "족발"],
            "인물": ["세종대왕", "이순신", "손흥민", "BTS", "유재석", "아이유", "아인슈타인", "아브라함 링컨", "뉴턴", "피카소"],
            "게임": ["리그오브레전드", "마인크래프트", "메이플스토리", "오버워치", "배틀그라운드", "로블록스", "원신", "테일즈런너", "어몽어스", "카트라이더"],
            "애니": ["짱구는 못말려", "도라에몽", "원피스", "나루토", "귀멸의 칼날", "명탐정 코난", "포켓몬스터", "드래곤볼", "진격의 거인", "스파이 패밀리"]
        };

        window.onload = function() {
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d');
            setupCanvasEvents();
        };

        function showScreen(screenId) {
            var screens = document.querySelectorAll('.screen');
            for (var i = 0; i < screens.length; i++) { screens[i].classList.remove('active'); }
            document.getElementById(screenId).classList.add('active');
        }

        function getRandomCode() {
            return Math.random().toString(36).substring(2, 7).toUpperCase();
        }

        function createRoom() {
            var name = document.getElementById('create-name').value.trim();
            if (!name) return alert("닉네임을 입력해주세요!");

            myName = name;
            roomCode = getRandomCode();
            isHost = true;
            playersMap = {};
            playersMap[myName] = true;

            peer = new Peer('liar-room-' + roomCode);

            peer.on('open', function() {
                enterLobby();
            });

            peer.on('connection', function(conn) {
                connections.push(conn);
                conn.on('data', function(data) {
                    handleNetworkData(data);
                });
            });

            peer.on('error', function(err) { alert("방 생성 에러: " + err.type); });
        }

        function joinRoomByCode() {
            var code = document.getElementById('join-code').value.trim().toUpperCase();
            var name = document.getElementById('join-name').value.trim();
            if (!code || !name) return alert("방 코드와 닉네임을 모두 입력해주세요!");
            roomCode = code; myName = name; connectToHost();
        }

        function joinRoomByLink() {
            var name = document.getElementById('link-join-name').value.trim();
            if (!name) return alert("닉네임을 입력해주세요!");
            myName = name; connectToHost();
        }

        function connectToHost() {
            peer = new Peer();
            peer.on('open', function() {
                hostConn = peer.connect('liar-room-' + roomCode);
                hostConn.on('open', function() {
                    hostConn.send({ type: 'JOIN', name: myName });
                    enterLobby();
                });
                hostConn.on('data', handleNetworkData);
            });
            peer.on('error', function() { alert("방 접속 실패! 코드를 확인해주세요."); });
        }

        function sendData(data) {
            if (isHost) {
                handleNetworkData(data); // 방장은 본인 데이터 직접 처리
            } else if (hostConn && hostConn.open) {
                hostConn.send(data);
            }
        }

        function handleNetworkData(data) {
            // --- [방장(Host) 전용 상태 처리] ---
            if (isHost) {
                if (data.type === 'JOIN') {
                    playersMap[data.name] = true;
                    renderPlayers();
                    broadcastData({ type: 'SYNC', players: playersMap, settings: gameSettings });
                    return;
                }
                if (data.type === 'REQ_NEXT_TURN') {
                    // 클라이언트에서 턴 종료 요청 시 방장이 권한을 갖고 계산
                    if (data.stroke && data.stroke.length > 0) {
                        turnsHistory.push({ player: data.player, path: data.stroke });
                    }
                    currentTurnIndex = (currentTurnIndex + 1) % playerOrder.length;
                    
                    var syncPayload = { 
                        type: 'SYNC_TURNS', 
                        history: turnsHistory, 
                        turnIndex: currentTurnIndex 
                    };
                    broadcastData(syncPayload);
                    handleNetworkData(syncPayload); // 방장 자신 화면 업데이트
                    return;
                }
                if (data.type === 'REQ_RESET_STROKE') {
                    currentStroke = [];
                    var syncPayload = { 
                        type: 'SYNC_TURNS', 
                        history: turnsHistory, 
                        turnIndex: currentTurnIndex 
                    };
                    broadcastData(syncPayload);
                    handleNetworkData(syncPayload);
                    return;
                }
                if (data.type === 'DRAW_LIVE') {
                    broadcastData(data); // 라이브 그림선 전달 중계
                }
            }

            // --- [모든 클라이언트 공통 데이터 수신] ---
            if (data.type === 'SYNC') {
                playersMap = data.players;
                gameSettings = data.settings;
                applySettingsUI();
                renderPlayers();
            } else if (data.type === 'START_GAME_INFO') {
                playerOrder = data.order;
                var myRole = data.liars.includes(myName) ? "라이어" : "시민";
                handleGameStart(myRole, data.keyword, data.mode);
            } else if (data.type === 'DRAW_LIVE') {
                if (data.sender !== myName) { // 본인 보낸 선 중복 출력 방지
                    drawSegment(data.strokeData);
                }
            } else if (data.type === 'SYNC_TURNS') {
                turnsHistory = data.history;
                currentTurnIndex = data.turnIndex;
                redrawCanvas();
                updateTurnState();
            }
        }

        function enterLobby() {
            showScreen('screen-lobby');
            document.getElementById('header-bar').style.display = 'block';
            document.getElementById('display-room-code').innerText = roomCode;
            document.getElementById('lobby-code').innerText = roomCode;
            document.getElementById('lobby-link').innerText = window.location.href.split('?')[0] + '?room=' + roomCode;
            document.getElementById('connection-status').innerText = isHost ? "● 방장" : "● 참여 완료";

            var categorySelect = document.getElementById('setting-category');
            var modeSelect = document.getElementById('setting-mode');

            if (isHost) {
                document.getElementById('btn-start').style.display = 'block';
                categorySelect.disabled = false;
                modeSelect.disabled = false;
            } else {
                document.getElementById('btn-start').style.display = 'none';
                categorySelect.disabled = true;
                modeSelect.disabled = true;
            }

            renderPlayers();
        }

        function changeLiarCount(delta) {
            if (!isHost) return;
            var maxLiar = Math.max(1, Object.keys(playersMap).length - 1);
            var newCount = gameSettings.liarCount + delta;
            if (newCount >= 1 && newCount <= maxLiar) {
                gameSettings.liarCount = newCount;
                updateSettings();
            }
        }

        function updateSettings() {
            if (!isHost) return;
            gameSettings.category = document.getElementById('setting-category').value;
            gameSettings.mode = document.getElementById('setting-mode').value;
            broadcastData({ type: 'SYNC', players: playersMap, settings: gameSettings });
        }

        function applySettingsUI() {
            document.getElementById('setting-category').value = gameSettings.category;
            document.getElementById('setting-mode').value = gameSettings.mode;
            document.getElementById('liar-count-display').innerText = gameSettings.liarCount;
        }

        function renderPlayers() {
            var listDiv = document.getElementById('player-list');
            listDiv.innerHTML = '';
            var names = Object.keys(playersMap);
            document.getElementById('player-count').innerText = names.length;

            for (var i = 0; i < names.length; i++) {
                var badge = document.createElement('span');
                badge.className = 'player-badge';
                badge.textContent = names[i];
                listDiv.appendChild(badge);
            }

            if (names.length >= 3) {
                document.getElementById('start-warning').style.display = 'none';
            }
            applySettingsUI();
        }

        function broadcastData(data) {
            for (var i = 0; i < connections.length; i++) {
                if (connections[i].open) connections[i].send(data);
            }
        }

        function startGame() {
            var playerNames = Object.keys(playersMap);
            var warningBox = document.getElementById('start-warning');

            if (playerNames.length < 3) {
                warningBox.style.display = 'block';
                return;
            }

            warningBox.style.display = 'none';

            var words = wordDatabase[gameSettings.category];
            var selectedKeyword = words[Math.floor(Math.random() * words.length)];
            
            playerOrder = [...playerNames].sort(() => 0.5 - Math.random());
            var liars = [...playerOrder].sort(() => 0.5 - Math.random()).slice(0, gameSettings.liarCount);

            var myRole = liars.includes(myName) ? "라이어" : "시민";

            var startPayload = { 
                type: 'START_GAME_INFO', 
                liars: liars, 
                keyword: selectedKeyword, 
                mode: gameSettings.mode,
                order: playerOrder
            };

            broadcastData(startPayload);
            handleNetworkData(startPayload);
        }

        function handleGameStart(role, keyword, mode) {
            showScreen('screen-game');
            var rouletteBox = document.getElementById('roulette-box');
            var resultBox = document.getElementById('role-result-box');
            
            rouletteBox.style.display = 'block';
            resultBox.style.display = 'none';

            var items = ["라이어", "시민", "라이어", "시민"];
            if (mode === "스파이 모드") items.push("스파이");
            else if (mode === "바보 모드") items.push("바보");

            var count = 0;
            var interval = setInterval(function() {
                rouletteBox.innerText = items[Math.floor(Math.random() * items.length)];
                count++;

                if (count > 25) {
                    clearInterval(interval);
                    rouletteBox.style.display = 'none';
                    resultBox.style.display = 'block';

                    document.getElementById('my-role').innerText = role;
                    if (role === "라이어") {
                        document.getElementById('my-role').style.color = "#dc3545";
                        document.getElementById('my-keyword').innerText = "제시어: ??? (당신은 라이어입니다!)";
                    } else {
                        document.getElementById('my-role').style.color = "#28a745";
                        document.getElementById('my-keyword').innerText = "제시어: " + keyword;
                    }

                    setTimeout(initDrawingPhase, 3000);
                }
            }, 100);
        }

        function initDrawingPhase() {
            showScreen('screen-drawing');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            turnsHistory = [];
            currentTurnIndex = 0;

            var myTurnNumber = playerOrder.indexOf(myName) + 1;
            var announceBox = document.getElementById('turn-announcement');
            announceBox.innerText = "당신은 " + myTurnNumber + "번째 순서입니다!";

            setTimeout(function() {
                announceBox.innerText = "";
                updateTurnState();
            }, 2500);
        }

        function updateTurnState() {
            var activePlayer = playerOrder[currentTurnIndex];
            document.getElementById('turn-indicator').innerText = "현재 순서: " + activePlayer + "님";
            
            var isMyTurn = (activePlayer === myName);
            document.getElementById('my-turn-controls').style.display = isMyTurn ? "flex" : "none";
            
            hasDrawnThisTurn = false;
            isDrawing = false;
            currentStroke = [];
        }

        function setupCanvasEvents() {
            function getPos(e) {
                var rect = canvas.getBoundingClientRect();
                var clientX = e.touches ? e.touches[0].clientX : e.clientX;
                var clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            function startDraw(e) {
                if (playerOrder[currentTurnIndex] !== myName || hasDrawnThisTurn) return;
                isDrawing = true;
                var pos = getPos(e);
                currentStroke = [];
                
                var point = {
                    x: pos.x, y: pos.y,
                    color: document.getElementById('brush-color').value,
                    size: document.getElementById('brush-size').value,
                    type: 'start'
                };
                currentStroke.push(point);
                drawSegment(point);
                sendData({ type: 'DRAW_LIVE', strokeData: point, sender: myName });
            }

            function moveDraw(e) {
                if (!isDrawing) return;
                var pos = getPos(e);
                var point = {
                    x: pos.x, y: pos.y,
                    color: document.getElementById('brush-color').value,
                    size: document.getElementById('brush-size').value,
                    type: 'move'
                };
                currentStroke.push(point);
                drawSegment(point);
                sendData({ type: 'DRAW_LIVE', strokeData: point, sender: myName });
            }

            function stopDraw() {
                if (isDrawing) {
                    isDrawing = false;
                    hasDrawnThisTurn = true;
                }
            }

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', moveDraw);
            canvas.addEventListener('mouseup', stopDraw);

            canvas.addEventListener('touchstart', function(e) { startDraw(e); e.preventDefault(); });
            canvas.addEventListener('touchmove', function(e) { moveDraw(e); e.preventDefault(); });
            canvas.addEventListener('touchend', stopDraw);
        }

        function drawSegment(pt) {
            ctx.strokeStyle = pt.color;
            ctx.lineWidth = pt.size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (pt.type === 'start') {
                ctx.beginPath();
                ctx.moveTo(pt.x, pt.y);
            } else if (pt.type === 'move') {
                ctx.lineTo(pt.x, pt.y);
                ctx.stroke();
            }
        }

        function redrawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (var i = 0; i < turnsHistory.length; i++) {
                var stroke = turnsHistory[i].path;
                for (var j = 0; j < stroke.length; j++) {
                    drawSegment(stroke[j]);
                }
            }
        }

        function resetMyStroke() {
            if (playerOrder[currentTurnIndex] !== myName) return;
            hasDrawnThisTurn = false;
            currentStroke = [];
            sendData({ type: 'REQ_RESET_STROKE' });
        }

        function finishMyTurn() {
            if (playerOrder[currentTurnIndex] !== myName) return;
            
            // 방장에게 턴 종료 요청 전송
            sendData({ 
                type: 'REQ_NEXT_TURN', 
                player: myName, 
                stroke: currentStroke 
            });
        }

        function copyLink() {
            var linkText = document.getElementById('lobby-link').innerText;
            navigator.clipboard.writeText(linkText).then(function() {
                alert("초대 링크가 복사되었습니다!");
            });
        }
    </script>
</body>
</html>
